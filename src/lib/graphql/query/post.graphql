query Post($uri: ID!) {
  post(id: $uri, idType: URI) {
    id
    content
    title
    date
    uri
    seo {
      metaDesc
    }
    tags {
      nodes {
        name
        slug
      }
    }
    infos {
      author
      embed
      pdf {
        node {
          fileSize
          mediaItemUrl
          mediaType
          mimeType
          title
        }
      }
    }

    categories {
      nodes {
        name
        slug
      }
    }
  }
}